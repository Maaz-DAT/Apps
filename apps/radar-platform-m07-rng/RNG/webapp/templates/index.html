<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M-02 — Bus Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>M-02 — Platform Data Bus</h1>
  <div class="sub" id="conn">connecting…</div>
</header>

<div class="grid">

  <div class="panel">
    <h2>Throughput</h2>
    <div><span class="rate-readout" id="rate">0</span><span class="rate-unit">msg/s</span></div>
    <div class="stat-row"><span>Total published</span><span class="v" id="total">0</span></div>
    <div class="stat-row"><span>Reorder events</span><span class="v" id="reorder">0</span></div>
    <div class="stat-row"><span>Recorded frames</span><span class="v" id="recframes">0</span></div>
  </div>

  <div class="panel">
    <h2>Generator</h2>
    <div class="ctl-group">
      <div class="ctl-row"><span class="led" id="led-gen"></span><span id="gen-label">stopped</span></div>
      <div class="ctl-row">
        <input type="number" id="rate-input" value="1000" min="1">
        <span style="font-family:var(--mono); font-size:0.75rem;">target Hz</span>
      </div>
      <div class="ctl-row">
        <button onclick="startGen()">Start</button>
        <button class="danger" onclick="stopGen()">Stop</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Record / Replay</h2>
    <div class="ctl-group">
      <div class="ctl-row"><span class="led" id="led-rec"></span><span id="rec-label">idle</span></div>
      <div class="ctl-row">
        <input type="text" id="record-name" placeholder="Capture name (optional)" aria-label="Capture name">
      </div>
      <div class="ctl-row">
        <button onclick="startRec()">Record</button>
        <button class="danger" onclick="stopRec()">Stop</button>
      </div>
    </div>
    <div class="ctl-group">
      <div class="ctl-row">
        <select id="recording-select" aria-label="Saved recording">
          <option value="">Loading recordings...</option>
        </select>
        <button onclick="refreshRecordings()" aria-label="Refresh recordings">Refresh</button>
      </div>
      <div class="ctl-row"><span class="led" id="led-replay"></span><span id="replay-label">idle</span></div>
      <div class="ctl-row">
        <input type="number" id="speed-input" value="1" min="0.1" step="0.1" style="width:60px">
        <span style="font-family:var(--mono); font-size:0.75rem;">x speed</span>
      </div>
      <div class="ctl-row">
        <button onclick="startReplay()">Replay</button>
        <button class="danger" onclick="stopReplay()">Stop</button>
      </div>
      <div class="recording-message" id="recording-message" role="status"></div>
    </div>
  </div>

  <div class="panel wide">
    <h2>Recent frames (sampled)</h2>
    <div class="log" id="log"></div>
  </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
